plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.example.qqhook'

    defaultConfig {
        applicationId "com.example.qqhook"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 打包 assets 中的 xposed 声明文件
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // XposedBridge API — JitPack (rovo89/XposedBridge)，compileOnly 不打进 APK
    compileOnly 'com.github.rovo89:XposedBridge:v82'
}
